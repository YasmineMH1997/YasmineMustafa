# ==============================
# Site Identity
# ==============================
title: 'Yasmine Mustafa'
slogan: 'ML Researcher • Medical Imaging • Multimodal Transformers'
description: 'Personal website and portfolio for my research in deep learning, neuroimaging, and Alzheimer’s disease detection.'
credits: '<p>Created with ♥ using Jekyll and the Feeling Responsive theme.</p>'
author: yasmine   # match a key in _data/authors.yml (you can create one)

# ==============================
# URLs
# ==============================
url: 'https://yasminemh1997.github.io'
baseurl: '/YasmineMustafa'
improve_content: 'https://github.com/yasminemh1997/YasmineMustafa/edit/gh-pages'

# Base path for images
urlimg: '/YasmineMustafa/images/'

# ==============================
# Branding
# ==============================
logo: ""

# ==============================
# Plugins
# ==============================
plugins:
  - jekyll-asciidoc
  - jekyll-gist
  - jekyll-paginate

# Paginations
paginate: 5
paginate_path: "blog/page:num"

# ==============================
# Content & Markup
# ==============================
markdown: kramdown
permalink: /:categories/:title/
highlight: rouge
excerpt_separator: "<!--more-->"
include: ['.htaccess']
exclude:
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - INSTALL.md
  - vendor
language: 'en'

# ==============================
# HTML Compression
# ==============================
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  profile: false
  ignore:
    envs: [development]

# ==============================
# Defaults
# ==============================
defaults:
  # Homepage — show banner
  - scope:
      path: "index.md"
      type: "pages"
    values:
      show_meta: false
      comments: false
      author: yasmine
      header:
        image_fullwidth: "banner.jpg"   # must exist in images/
        title: "Yasmine Mustafa"
        subheadline: "ML Researcher • Medical Imaging • Multimodal Transformers"

  # All other pages — no banner
  - scope:
      path: ""
      type: "pages"
    values:
      show_meta: false
      comments: false
      author: yasmine
      header: false

  # Blog posts — no banner
  - scope:
      path: ""
      type: "posts"
    values:
      show_meta: true
      comments: false
      author: yasmine
      header: false

  # Publications — no banner
  - scope:
      path: ""
      type: "publications"
    values:
      show_meta: false
      comments: false
      author: yasmine
      header: false

# ==============================
# Favicons
# ==============================
favicon-32x32: 'touch-icon.png'
touch-icon-192x192: 'touch-icon.png'
apple-touch-icon-180x180-precomposed: 'touch-icon.png'

# ==============================
# Social Media
# ==============================
socialmedia:
  github: yasmineh1997
  linkedin: yasmine-attia
  google-scholar: YOUR_SCHOLAR_ID

# ==============================
# Sass
# ==============================
sass:
  sass_dir: _sass
  style: :compressed

collections:
  publications:
    output: true
    permalink: /publications/:slug/
urlimg: "/YasmineMustafa/images/"

